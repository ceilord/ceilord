<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Hosted or self-hosted Ceilord</title>
  <desc id="desc">Choose Ceilord hosted by Ceilord or deploy it in your own environment.</desc>
  <rect width="1400" height="430" fill="#ffffff"/>
  <text x="58" y="68" fill="#262626" font-family="Georgia, 'Times New Roman', serif" font-size="46">Choose how you run Ceilord.</text>
  <text x="58" y="103" fill="#7d7d7d" font-family="Arial, Helvetica, sans-serif" font-size="17">Hosted by Ceilord or deployed in your own environment.</text>

  <g transform="translate(58 150)">
    <rect width="596" height="222" rx="22" fill="#ffffff" stroke="#e7e7e7"/>
    <text x="30" y="44" fill="#62666d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.1">HOSTED BY CEILORD</text>
    <g transform="translate(34 91)" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#50555d">
      <g><circle cx="10" cy="10" r="10" fill="#f1f2f4"/><path d="M6 10l3 3 5-6" fill="none" stroke="#7b8087" stroke-width="1.5"/><text x="34" y="15">start without operating infrastructure</text></g>
      <g transform="translate(0 40)"><circle cx="10" cy="10" r="10" fill="#f1f2f4"/><path d="M6 10l3 3 5-6" fill="none" stroke="#7b8087" stroke-width="1.5"/><text x="34" y="15">Ceilord manages deployment and updates</text></g>
      <g transform="translate(0 80)"><circle cx="10" cy="10" r="10" fill="#f1f2f4"/><path d="M6 10l3 3 5-6" fill="none" stroke="#7b8087" stroke-width="1.5"/><text x="34" y="15">writing runs through the hosted service</text></g>
    </g>
    <text x="412" y="189" fill="#a0a0a0" font-family="Arial, Helvetica, sans-serif" font-size="13">managed</text>
  </g>

  <g transform="translate(746 150)">
    <rect width="596" height="222" rx="22" fill="#f4f6ff" stroke="#d9dcff"/>
    <text x="30" y="44" fill="#3f49d8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.1">SELF-HOSTED</text>
    <g transform="translate(34 91)" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#454b63">
      <g><circle cx="10" cy="10" r="10" fill="#5863ea"/><path d="M6 10l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5"/><text x="34" y="15">deploy in your own environment</text></g>
      <g transform="translate(0 40)"><circle cx="10" cy="10" r="10" fill="#5863ea"/><path d="M6 10l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5"/><text x="34" y="15">Ceilord hosted API is not in the writing path</text></g>
      <g transform="translate(0 80)"><circle cx="10" cy="10" r="10" fill="#5863ea"/><path d="M6 10l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5"/><text x="34" y="15">you control storage, access, and retention</text></g>
    </g>
    <text x="408" y="189" fill="#8389ab" font-family="Arial, Helvetica, sans-serif" font-size="13">your environment</text>
  </g>
</svg>
