    <text x="126" y="92" fill="#111318" font-family="Georgia, 'Times New Roman', serif" font-size="25">Write a launch article for content leads about the</text>
    <text x="126" y="123" fill="#111318" font-family="Georgia, 'Times New Roman', serif" font-size="25">new reporting workspace.</text>

    <rect x="22" y="170" width="716" height="110" rx="14" fill="#fbfbfc" stroke="#edf0f4"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <g transform="translate(43 194)">
        <text fill="#718096" font-size="10" font-weight="700" letter-spacing="1.2">AUDIENCE</text>
        <text y="27" fill="#252a32" font-size="14">Content leads</text>
      </g>
      <line x1="190" y1="186" x2="190" y2="263" stroke="#e1e5eb"/>
      <g transform="translate(217 194)">
        <text fill="#718096" font-size="10" font-weight="700" letter-spacing="1.2">LENGTH</text>
        <text y="27" fill="#252a32" font-size="14">1,200 – 1,600 words</text>
      </g>
      <line x1="383" y1="186" x2="383" y2="263" stroke="#e1e5eb"/>
      <g transform="translate(409 194)">
        <text fill="#718096" font-size="10" font-weight="700" letter-spacing="1.2">TONE</text>
        <text y="27" fill="#252a32" font-size="14">Clear, professional,</text>
        <text y="47" fill="#252a32" font-size="14">practical</text>
      </g>
      <line x1="564" y1="186" x2="564" y2="263" stroke="#e1e5eb"/>
      <g transform="translate(590 194)">
