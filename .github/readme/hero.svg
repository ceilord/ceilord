      <g transform="translate(440 0)"><circle r="13" fill="#2878ff"/><path d="M-5 0l4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="-19" y="39" fill="#20242b" font-size="14">check</text></g>
      <g transform="translate(618 0)"><circle r="13" fill="#fff" stroke="#bfc7d2" stroke-width="1.5"/><text x="-18" y="39" fill="#20242b" font-size="14">result</text></g>
    </g>

    <rect x="22" y="382" width="716" height="169" rx="14" fill="#ffffff" stroke="#e4e8ee"/>
    <text x="44" y="409" fill="#718096" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">QUALITY ASSURANCE</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#292e36">
