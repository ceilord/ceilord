      <line x1="44" y1="497" x2="716" y2="497" stroke="#edf0f4"/>
      <g transform="translate(53 511)"><circle r="10" fill="#2878ff"/><path d="M-4 0l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.6"/><text x="23" y="5">Length requirement checked</text></g>
      <line x1="44" y1="532" x2="716" y2="532" stroke="#edf0f4"/>
      <g transform="translate(53 546)"><circle r="10" fill="#2878ff"/><path d="M-4 0l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.6"/><text x="23" y="5">Not AI detected</text></g>
    </g>
  </g>

