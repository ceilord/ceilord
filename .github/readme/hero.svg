<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Ceilord product overview</title>
  <desc id="desc">Ceilord wordmark and long-form AI writing proposition beside an example writing job with structured criteria and quality checks.</desc>
  <rect width="1600" height="700" fill="#ffffff"/>

  <g fill="#07090d">
    <text x="54" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="174" font-weight="400" letter-spacing="-12">ceilord</text>
    <text x="62" y="332" font-family="Georgia, 'Times New Roman', serif" font-size="59" font-weight="400" letter-spacing="-2.4">Long-form AI writing built</text>
    <text x="62" y="397" font-family="Georgia, 'Times New Roman', serif" font-size="59" font-weight="400" letter-spacing="-2.4">from how real people write.</text>
  </g>

  <g fill="#718096" font-family="Arial, Helvetica, sans-serif" font-size="20">
    <text x="64" y="454">Ceilord takes a topic or brief and produces the piece itself —</text>
    <text x="64" y="488">not post-generation humanization.</text>
  </g>

  <g transform="translate(790 42)">
    <rect x="0" y="0" width="760" height="575" rx="22" fill="#ffffff" stroke="#dfe4eb" stroke-width="1.4"/>

