        <text y="27" fill="#252a32" font-size="14">Key benefits,</text>
        <text y="47" fill="#252a32" font-size="14">use cases, rollout</text>
      </g>
    </g>

    <g transform="translate(49 312)" font-family="Arial, Helvetica, sans-serif">
      <line x1="0" y1="0" x2="618" y2="0" stroke="#cfd5df" stroke-width="1.5"/>
